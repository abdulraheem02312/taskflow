<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- The reset link is a secret: never send it to other sites in the Referer header -->
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex">
  <title>Choose a new password | Taskflow</title>
  <link rel="icon" href="/img/favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
  <meta name="theme-color" content="#050505">
  <!-- Apply the saved theme before the first paint, so the page never flashes the wrong colors -->
  <script>(function(){var p="dark";try{p=localStorage.getItem("theme")||"dark"}catch(e){}var t=p==="system"?(matchMedia("(prefers-color-scheme: light)").matches?"light":"dark"):(p==="light"?"light":"dark");document.documentElement.dataset.theme=t;})();</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="auth-page">
  <main class="auth-card">
    <a class="logo" href="/"><img class="logo-mark" src="/img/logo.png" alt="" width="26" height="26"> Taskflow</a>

    <div id="reset-step">
      <h1>Choose a new password</h1>
      <p class="auth-intro" id="reset-intro">Checking your link...</p>
      <form id="reset-form" hidden>
        <label>New password <input type="password" name="password" minlength="8" required autocomplete="new-password"></label>
        <div class="meter" id="reset-meter"><span class="meter-bar"><i></i></span><span class="meter-label"></span></div>
        <label>Repeat new password <input type="password" name="repeat" required autocomplete="new-password"></label>
        <p class="form-error" id="form-error"></p>
        <button type="submit" class="btn btn-primary">Save new password</button>
      </form>
    </div>

    <div class="auth-done" id="reset-invalid" hidden>
      <div class="auth-done-icon bad">!</div>
      <h1>This link has expired</h1>
      <p class="auth-intro">Reset links work for 30 minutes and only once. Ask for a new one and use the newest email.</p>
      <a class="btn btn-primary" href="/forgot-password">Get a new link</a>
    </div>

    <p class="auth-switch"><a href="/login">Back to log in</a></p>
  </main>
  <script src="/js/theme.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/password.js"></script>
</body>
</html>
